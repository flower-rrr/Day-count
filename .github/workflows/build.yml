name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate project files
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Countdown"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          mkdir -p app
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.countdown'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.countdown"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("HOME") + "/.android/my.keystore")
                      storePassword "mypassword123"
                      keyAlias "mykey"
                      keyPassword "mypassword123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Countdown">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".CountdownService" android:exported="false"
                      android:foregroundServiceType="specialUse"/>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/java/com/example/countdown

          # CountdownService.java
          cat > app/src/main/java/com/example/countdown/CountdownService.java << 'JEOF'
          package com.example.countdown;

          import android.annotation.SuppressLint;
          import android.app.*;
          import android.content.Intent;
          import android.graphics.*;
          import android.os.*;
          import android.view.*;
          import androidx.core.app.NotificationCompat;

          public class CountdownService extends Service {
              private static CountdownService instance;
              private WindowManager wm;
              private CountdownView overlayView;
              private boolean viewAdded = false;
              private long targetMillis = 0;
              private final Handler handler = new Handler(Looper.getMainLooper());

              public static CountdownService getInstance() { return instance; }

              private final Runnable ticker = new Runnable() {
                  @Override public void run() {
                      if (overlayView != null && viewAdded) overlayView.invalidate();
                      handler.postDelayed(this, 50);
                  }
              };

              @Override public void onCreate() {
                  super.onCreate(); instance = this;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  overlayView = new CountdownView(this);
                  startForeground(1, buildNotification());
              }

              public void startOverlay(long targetMs, boolean enableBg) {
                  this.targetMillis = targetMs;
                  if (!viewAdded) {
                      int type = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;
                      // 這裡高度改為 MATCH_PARENT 以填滿螢幕
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                      params.gravity = Gravity.CENTER;
                      wm.addView(overlayView, params);
                      viewAdded = true;
                  }
                  overlayView.setTarget(targetMs, enableBg);
                  handler.post(ticker);
              }

              public void stopOverlay() {
                  handler.removeCallbacks(ticker);
                  if (viewAdded) { wm.removeView(overlayView); viewAdded = false; }
              }

              public void updateTarget(long targetMs, boolean enableBg) {
                  this.targetMillis = targetMs;
                  if (overlayView != null) overlayView.setTarget(targetMs, enableBg);
              }

              private Notification buildNotification() {
                  String ch = "countdown_ch";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE))
                          .createNotificationChannel(new NotificationChannel(ch, "倒數計時", NotificationManager.IMPORTANCE_LOW));
                  PendingIntent pi = PendingIntent.getActivity(this, 0,
                      new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  return new NotificationCompat.Builder(this, ch)
                      .setContentTitle("倒數計時運行中").setContentText("點擊返回設定")
                      .setSmallIcon(android.R.drawable.ic_dialog_info).setContentIntent(pi).build();
              }

              @Override public int onStartCommand(Intent i, int f, int s) { return START_STICKY; }
              @Override public void onDestroy() {
                  super.onDestroy(); stopOverlay(); instance = null;
              }
              @Override public IBinder onBind(Intent i) { return null; }

              @SuppressLint("ViewConstructor")
              static class CountdownView extends View {
                  private long targetMillis = 0;
                  private boolean enableBg = false;
                  private final Paint bgPaint = new Paint();
                  private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint subPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  CountdownView(android.content.Context ctx) {
                      super(ctx);
                      bgPaint.setStyle(Paint.Style.FILL);
                      
                      textPaint.setColor(Color.parseColor("#FF9F0A"));
                      textPaint.setTextSize(144f);
                      textPaint.setTextAlign(Paint.Align.CENTER);
                      textPaint.setFakeBoldText(true);
                      textPaint.setShadowLayer(10f, 0f, 5f, Color.BLACK);

                      subPaint.setColor(Color.parseColor("#CCCCCC"));
                      subPaint.setTextSize(84f);
                      subPaint.setTextAlign(Paint.Align.CENTER);
                      subPaint.setShadowLayer(8f, 0f, 4f, Color.BLACK);
                  }

                  void setTarget(long ms, boolean bg) { 
                      this.targetMillis = ms; 
                      this.enableBg = bg;
                      invalidate(); 
                  }

                  @Override protected void onMeasure(int w, int h) {
                      // 由於外層是 MATCH_PARENT，這裡直接取分配到的全螢幕尺寸
                      setMeasuredDimension(MeasureSpec.getSize(w), MeasureSpec.getSize(h));
                  }

                  @Override protected void onDraw(Canvas canvas) {
                      long now = System.currentTimeMillis();
                      long diff = targetMillis - now;

                      // 1. 處理背景邏輯
                      if (enableBg) {
                          double exactDays = Math.abs(diff) / 86400000.0;
                          double opacityPercent = 0.0;
                          
                          if (exactDays > 0) {
                              if (diff > 0) {
                                  // 還沒到：100% / (1.1 * 剩餘天數)
                                  opacityPercent = 100.0 / (1.1 * exactDays);
                              } else {
                                  // 超過後遞減：100% / 超過天數
                                  opacityPercent = 100.0 / exactDays;
                              }
                          } else {
                              // 剛好為 0 的極限值
                              opacityPercent = 95.0; 
                          }
                          
                          // 最高限制 95%
                          if (opacityPercent > 95.0) opacityPercent = 95.0;
                          
                          int alpha = (int) Math.round((opacityPercent / 100.0) * 255.0);
                          bgPaint.setColor(Color.RED);
                          bgPaint.setAlpha(alpha);
                          canvas.drawRect(0, 0, getWidth(), getHeight(), bgPaint);
                      }

                      // 2. 處理文字邏輯 (文字倒數卡在 0，不顯示負數)
                      long displayDiff = diff < 0 ? 0 : diff;
                      long totalSec = displayDiff / 1000;
                      long days    = totalSec / 86400;
                      long hours   = (totalSec % 86400) / 3600;
                      long minutes = (totalSec % 3600) / 60;
                      long seconds = totalSec % 60;
                      long centis  = (displayDiff % 1000) / 10;

                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;

                      if (days > 0) {
                          canvas.drawText(days + " 天", cx, cy - 80f, subPaint);
                          String timeStr = String.format("%02d:%02d:%02d.%02d", hours, minutes, seconds, centis);
                          canvas.drawText(timeStr, cx, cy + 120f, textPaint);
                      } else {
                          String timeStr = String.format("%02d:%02d:%02d.%02d", hours, minutes, seconds, centis);
                          canvas.drawText(timeStr, cx, cy + 40f, textPaint);
                      }
                  }
              }
          }
          JEOF

          # MainActivity.java
          cat > app/src/main/java/com/example/countdown/MainActivity.java << 'JEOF'
          package com.example.countdown;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import java.util.Calendar;

          public class MainActivity extends AppCompatActivity {
              private NumberPicker npYear, npMonth, npDay, npHour, npMin, npSec;
              private Switch swOverlay, swBg;
              private TextView tvStatus;
              private static final int REQ_PERM = 1001;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  npYear = findViewById(R.id.npYear); npMonth = findViewById(R.id.npMonth);
                  npDay = findViewById(R.id.npDay); npHour = findViewById(R.id.npHour);
                  npMin = findViewById(R.id.npMin); npSec = findViewById(R.id.npSec);
                  swOverlay = findViewById(R.id.swOverlay); 
                  swBg = findViewById(R.id.swBg);
                  tvStatus = findViewById(R.id.tvStatus);

                  Calendar now = Calendar.getInstance();
                  npYear.setMinValue(now.get(Calendar.YEAR)); npYear.setMaxValue(now.get(Calendar.YEAR) + 20);
                  npYear.setValue(now.get(Calendar.YEAR));
                  npMonth.setMinValue(1); npMonth.setMaxValue(12); npMonth.setValue(now.get(Calendar.MONTH) + 1);
                  npDay.setMinValue(1); npDay.setMaxValue(31); npDay.setValue(now.get(Calendar.DAY_OF_MONTH));
                  npHour.setMinValue(0); npHour.setMaxValue(23); npHour.setValue(now.get(Calendar.HOUR_OF_DAY));
                  npMin.setMinValue(0); npMin.setMaxValue(59); npMin.setValue(now.get(Calendar.MINUTE));
                  npSec.setMinValue(0); npSec.setMaxValue(59); npSec.setValue(now.get(Calendar.SECOND));

                  NumberPicker.OnValueChangeListener listener = (picker, oldVal, newVal) -> updateSwitchState();
                  npYear.setOnValueChangedListener(listener); npMonth.setOnValueChangedListener(listener);
                  npDay.setOnValueChangedListener(listener); npHour.setOnValueChangedListener(listener);
                  npMin.setOnValueChangedListener(listener); npSec.setOnValueChangedListener(listener);

                  // 背景開關變更時也同步更新 Service
                  swBg.setOnCheckedChangeListener((btn, checked) -> updateSwitchState());

                  swOverlay.setOnCheckedChangeListener((btn, checked) -> {
                      if (checked) {
                          if (!hasPerm()) { requestPerm(); swOverlay.setChecked(false); return; }
                          startService(new Intent(this, CountdownService.class));
                          new android.os.Handler().postDelayed(() -> {
                              CountdownService svc = CountdownService.getInstance();
                              if (svc != null) svc.startOverlay(getTargetMillis(), swBg.isChecked());
                          }, 300);
                          tvStatus.setText("倒數顯示中");
                      } else {
                          CountdownService svc = CountdownService.getInstance();
                          if (svc != null) svc.stopOverlay();
                          tvStatus.setText("已關閉");
                      }
                  });
              }

              private void updateSwitchState() {
                  long target = getTargetMillis();
                  boolean future = target > System.currentTimeMillis();
                  
                  // 如果未開啟 Overlay，只允許設定未來時間才能開啟
                  // 如果已經開啟，就不再強制關閉（讓過期後背景遞減的效果可以繼續運行）
                  if (!swOverlay.isChecked()) {
                      swOverlay.setEnabled(future);
                  } else {
                      swOverlay.setEnabled(true);
                  }

                  if (swOverlay.isChecked()) {
                      CountdownService svc = CountdownService.getInstance();
                      if (svc != null) svc.updateTarget(target, swBg.isChecked());
                  }
              }

              private long getTargetMillis() {
                  Calendar c = Calendar.getInstance();
                  c.set(npYear.getValue(), npMonth.getValue()-1, npDay.getValue(), npHour.getValue(), npMin.getValue(), npSec.getValue());
                  c.set(Calendar.MILLISECOND, 0);
                  return c.getTimeInMillis();
              }
              private boolean hasPerm() { return Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this); }
              private void requestPerm() { startActivityForResult(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())), REQ_PERM); }
          }
          JEOF

          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#1C1C1E">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="vertical" android:gravity="center_horizontal" android:padding="24dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="⏳ 倒數計時" android:textColor="#FFFFFF" android:textSize="28sp" android:textStyle="bold" android:layout_marginBottom="32dp"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center">
                      <NumberPicker android:id="@+id/npYear" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="3"/>
                      <NumberPicker android:id="@+id/npMonth" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="2"/>
                      <NumberPicker android:id="@+id/npDay" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="2"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center" android:layout_marginTop="20dp">
                      <NumberPicker android:id="@+id/npHour" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"/>
                      <NumberPicker android:id="@+id/npMin" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"/>
                      <NumberPicker android:id="@+id/npSec" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"/>
                  </LinearLayout>
                  
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:layout_marginTop="40dp" android:background="#2C2C2E" android:padding="16dp">
                      <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="顯示倒數 Overlay" android:textColor="#FFFFFF" android:textSize="17sp"/>
                      <Switch android:id="@+id/swOverlay" android:layout_width="wrap_content" android:layout_height="wrap_content" android:thumbTint="#FF9F0A" android:trackTint="#3A3A3C"/>
                  </LinearLayout>
                  
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:layout_marginTop="16dp" android:background="#2C2C2E" android:padding="16dp">
                      <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="靠近目標時背景改變" android:textColor="#FFFFFF" android:textSize="17sp"/>
                      <Switch android:id="@+id/swBg" android:layout_width="wrap_content" android:layout_height="wrap_content" android:thumbTint="#FF9F0A" android:trackTint="#3A3A3C"/>
                  </LinearLayout>

                  <TextView android:id="@+id/tvStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="" android:textColor="#8E8E93" android:textSize="14sp" android:layout_marginTop="16dp"/>
                  
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="設定未來時間後才可開啟" android:textColor="#48484A"
                      android:textSize="13sp" android:layout_marginTop="8dp"/>
              </LinearLayout>
          </ScrollView>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">倒數計時</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Countdown" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#1C1C1E</item>
                  <item name="android:statusBarColor">#1C1C1E</item>
                  <item name="android:textColorPrimary">#FFFFFF</item>
                  <item name="colorControlNormal">#FF9F0A</item>
              </style>
          </resources>
          EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1C1C1E"/></shape>
          EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          for name in ic_launcher ic_launcher_round; do
            cat > app/src/main/res/mipmap-anydpi-v26/$name.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_background"/></adaptive-icon>
          EOF
          done
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
            for n in ic_launcher ic_launcher_round; do
              echo '<?xml version="1.0" encoding="utf-8"?><bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@drawable/ic_launcher_background"/>' > app/src/main/res/mipmap-$d/$n.xml
            done
          done
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew" -o gradlew
          chmod +x gradlew

      - name: Restore keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/my.keystore

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Countdown-APK
          path: app/build/outputs/apk/release/app-release.apk
