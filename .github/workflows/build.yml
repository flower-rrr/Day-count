name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate project files
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Countdown"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          mkdir -p app
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.countdown'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.countdown"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("HOME") + "/.android/my.keystore")
                      storePassword "mypassword123"
                      keyAlias "mykey"
                      keyPassword "mypassword123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Countdown">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".CountdownService" android:exported="false"
                      android:foregroundServiceType="specialUse"/>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/java/com/example/countdown

          # CountdownService.java
          cat > app/src/main/java/com/example/countdown/CountdownService.java << 'JEOF'
          package com.example.countdown;

          import android.annotation.SuppressLint;
          import android.app.*;
          import android.content.Intent;
          import android.graphics.*;
          import android.os.*;
          import android.util.DisplayMetrics;
          import android.view.*;
          import androidx.core.app.NotificationCompat;

          public class CountdownService extends Service {
              private static CountdownService instance;
              private WindowManager wm;
              private CountdownView overlayView;
              private boolean viewAdded = false;
              private long targetMillis = 0;
              private final Handler handler = new Handler(Looper.getMainLooper());

              public static CountdownService getInstance() { return instance; }

              private final Runnable ticker = new Runnable() {
                  @Override public void run() {
                      if (overlayView != null && viewAdded) overlayView.invalidate();
                      handler.postDelayed(this, 50); // 每 50ms 更新（小數點兩位）
                  }
              };

              @Override public void onCreate() {
                  super.onCreate(); instance = this;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  overlayView = new CountdownView(this);
                  startForeground(1, buildNotification());
              }

              public void startOverlay(long targetMs) {
                  this.targetMillis = targetMs;
                  if (!viewAdded) {
                      int type = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                      params.gravity = Gravity.CENTER;
                      wm.addView(overlayView, params);
                      viewAdded = true;
                  }
                  overlayView.setTarget(targetMs);
                  handler.post(ticker);
              }

              public void stopOverlay() {
                  handler.removeCallbacks(ticker);
                  if (viewAdded) { wm.removeView(overlayView); viewAdded = false; }
              }

              public void updateTarget(long targetMs) {
                  this.targetMillis = targetMs;
                  if (overlayView != null) overlayView.setTarget(targetMs);
              }

              private Notification buildNotification() {
                  String ch = "countdown_ch";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE))
                          .createNotificationChannel(new NotificationChannel(ch, "倒數計時", NotificationManager.IMPORTANCE_LOW));
                  PendingIntent pi = PendingIntent.getActivity(this, 0,
                      new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  return new NotificationCompat.Builder(this, ch)
                      .setContentTitle("倒數計時運行中").setContentText("點擊返回設定")
                      .setSmallIcon(android.R.drawable.ic_dialog_info).setContentIntent(pi).build();
              }

              @Override public int onStartCommand(Intent i, int f, int s) { return START_STICKY; }
              @Override public void onDestroy() {
                  super.onDestroy(); stopOverlay(); instance = null;
              }
              @Override public IBinder onBind(Intent i) { return null; }

              // ── Overlay View ──
              @SuppressLint("ViewConstructor")
              static class CountdownView extends View {
                  private long targetMillis = 0;
                  private final Paint bgPaint = new Paint();
                  private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint shadowPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint subPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  CountdownView(android.content.Context ctx) {
                      super(ctx);
                      // 主文字：白色大字
                      textPaint.setColor(Color.WHITE);
                      textPaint.setTextSize(72f);
                      textPaint.setTextAlign(Paint.Align.CENTER);
                      textPaint.setFakeBoldText(true);
                      textPaint.setLetterSpacing(0.05f);
                      // 陰影（加強可讀性）
                      textPaint.setShadowLayer(8f, 0f, 4f, Color.parseColor("#AA000000"));
                      // 天數小字
                      subPaint.setColor(Color.parseColor("#CCCCCC"));
                      subPaint.setTextSize(42f);
                      subPaint.setTextAlign(Paint.Align.CENTER);
                      subPaint.setFakeBoldText(false);
                      subPaint.setShadowLayer(6f, 0f, 3f, Color.parseColor("#AA000000"));
                  }

                  void setTarget(long ms) { targetMillis = ms; invalidate(); }

                  @Override protected void onMeasure(int w, int h) {
                      setMeasuredDimension(MeasureSpec.getSize(w), 160);
                  }

                  @Override protected void onDraw(Canvas canvas) {
                      long now = System.currentTimeMillis();
                      long diff = targetMillis - now;
                      if (diff < 0) diff = 0;

                      long totalSec = diff / 1000;
                      long days    = totalSec / 86400;
                      long hours   = (totalSec % 86400) / 3600;
                      long minutes = (totalSec % 3600) / 60;
                      long seconds = totalSec % 60;
                      long centis  = (diff % 1000) / 10; // 百分秒

                      float cx = getWidth() / 2f;

                      // 天數行
                      if (days > 0) {
                          String dayStr = days + " 天";
                          canvas.drawText(dayStr, cx, 50f, subPaint);
                          // 時分秒行
                          String timeStr = String.format("%02d:%02d:%02d.%02d", hours, minutes, seconds, centis);
                          canvas.drawText(timeStr, cx, 130f, textPaint);
                      } else {
                          // 只顯示時分秒（置中）
                          String timeStr = String.format("%02d:%02d:%02d.%02d", hours, minutes, seconds, centis);
                          canvas.drawText(timeStr, cx, 110f, textPaint);
                      }
                  }
              }
          }
          JEOF

          # MainActivity.java
          cat > app/src/main/java/com/example/countdown/MainActivity.java << 'JEOF'
          package com.example.countdown;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import java.util.Calendar;

          public class MainActivity extends AppCompatActivity {

              private NumberPicker npYear, npMonth, npDay, npHour, npMin, npSec;
              private Switch swOverlay;
              private TextView tvStatus;
              private static final int REQ_PERM = 1001;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  npYear  = findViewById(R.id.npYear);
                  npMonth = findViewById(R.id.npMonth);
                  npDay   = findViewById(R.id.npDay);
                  npHour  = findViewById(R.id.npHour);
                  npMin   = findViewById(R.id.npMin);
                  npSec   = findViewById(R.id.npSec);
                  swOverlay = findViewById(R.id.swOverlay);
                  tvStatus  = findViewById(R.id.tvStatus);

                  // 設定範圍
                  Calendar now = Calendar.getInstance();
                  npYear.setMinValue(now.get(Calendar.YEAR));
                  npYear.setMaxValue(now.get(Calendar.YEAR) + 20);
                  npYear.setValue(now.get(Calendar.YEAR));

                  npMonth.setMinValue(1); npMonth.setMaxValue(12);
                  npMonth.setValue(now.get(Calendar.MONTH) + 1);

                  npDay.setMinValue(1); npDay.setMaxValue(31);
                  npDay.setValue(now.get(Calendar.DAY_OF_MONTH));

                  npHour.setMinValue(0); npHour.setMaxValue(23);
                  npHour.setValue(now.get(Calendar.HOUR_OF_DAY));

                  npMin.setMinValue(0); npMin.setMaxValue(59);
                  npMin.setValue(now.get(Calendar.MINUTE));

                  npSec.setMinValue(0); npSec.setMaxValue(59);
                  npSec.setValue(now.get(Calendar.SECOND));

                  // 開關初始鎖定
                  swOverlay.setEnabled(false);
                  swOverlay.setChecked(false);

                  // 任何欄位改變時更新開關狀態
                  NumberPicker.OnValueChangeListener listener = (picker, oldVal, newVal) -> updateSwitchState();
                  npYear.setOnValueChangedListener(listener);
                  npMonth.setOnValueChangedListener(listener);
                  npDay.setOnValueChangedListener(listener);
                  npHour.setOnValueChangedListener(listener);
                  npMin.setOnValueChangedListener(listener);
                  npSec.setOnValueChangedListener(listener);

                  swOverlay.setOnCheckedChangeListener((btn, checked) -> {
                      if (checked) {
                          if (!hasPerm()) { requestPerm(); swOverlay.setChecked(false); return; }
                          startService(new Intent(this, CountdownService.class));
                          // 等 Service 啟動
                          new android.os.Handler().postDelayed(() -> {
                              CountdownService svc = CountdownService.getInstance();
                              if (svc != null) svc.startOverlay(getTargetMillis());
                          }, 300);
                          tvStatus.setText("倒數顯示中");
                      } else {
                          CountdownService svc = CountdownService.getInstance();
                          if (svc != null) svc.stopOverlay();
                          tvStatus.setText("已關閉");
                      }
                  });
              }

              private void updateSwitchState() {
                  long target = getTargetMillis();
                  boolean future = target > System.currentTimeMillis();
                  swOverlay.setEnabled(future);
                  if (!future && swOverlay.isChecked()) {
                      swOverlay.setChecked(false);
                      CountdownService svc = CountdownService.getInstance();
                      if (svc != null) svc.stopOverlay();
                  }
                  // 如果已開啟，即時更新目標
                  if (swOverlay.isChecked()) {
                      CountdownService svc = CountdownService.getInstance();
                      if (svc != null) svc.updateTarget(target);
                  }
              }

              private long getTargetMillis() {
                  Calendar c = Calendar.getInstance();
                  c.set(npYear.getValue(), npMonth.getValue()-1, npDay.getValue(),
                        npHour.getValue(), npMin.getValue(), npSec.getValue());
                  c.set(Calendar.MILLISECOND, 0);
                  return c.getTimeInMillis();
              }

              private boolean hasPerm() {
                  return Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this);
              }
              private void requestPerm() {
                  startActivityForResult(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                      Uri.parse("package:" + getPackageName())), REQ_PERM);
              }
              @Override protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_PERM && !hasPerm())
                      Toast.makeText(this, "需要「顯示在其他應用程式上方」的權限", Toast.LENGTH_LONG).show();
              }
          }
          JEOF

          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#1C1C1E">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="vertical" android:gravity="center_horizontal"
                  android:padding="24dp">

                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="⏳ 倒數計時" android:textColor="#FFFFFF"
                      android:textSize="28sp" android:textStyle="bold"
                      android:layout_marginBottom="32dp"/>

                  <!-- 日期選擇器 -->
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="目標日期" android:textColor="#8E8E93" android:textSize="14sp"
                      android:layout_marginBottom="8dp"/>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="horizontal" android:gravity="center">
                      <NumberPicker android:id="@+id/npYear"
                          android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="3"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="/" android:textColor="#FFFFFF" android:textSize="20sp"
                          android:paddingLeft="4dp" android:paddingRight="4dp"/>
                      <NumberPicker android:id="@+id/npMonth"
                          android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="2"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="/" android:textColor="#FFFFFF" android:textSize="20sp"
                          android:paddingLeft="4dp" android:paddingRight="4dp"/>
                      <NumberPicker android:id="@+id/npDay"
                          android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="2"/>
                  </LinearLayout>

                  <!-- 時間選擇器 -->
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="目標時間" android:textColor="#8E8E93" android:textSize="14sp"
                      android:layout_marginTop="20dp" android:layout_marginBottom="8dp"/>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="horizontal" android:gravity="center">
                      <NumberPicker android:id="@+id/npHour"
                          android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text=":" android:textColor="#FFFFFF" android:textSize="24sp"
                          android:paddingLeft="6dp" android:paddingRight="6dp"/>
                      <NumberPicker android:id="@+id/npMin"
                          android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text=":" android:textColor="#FFFFFF" android:textSize="24sp"
                          android:paddingLeft="6dp" android:paddingRight="6dp"/>
                      <NumberPicker android:id="@+id/npSec"
                          android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1"/>
                  </LinearLayout>

                  <!-- 開關 -->
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="horizontal" android:gravity="center_vertical"
                      android:layout_marginTop="40dp"
                      android:background="#2C2C2E" android:padding="16dp">
                      <TextView android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:text="顯示倒數 Overlay"
                          android:textColor="#FFFFFF" android:textSize="17sp"/>
                      <Switch android:id="@+id/swOverlay"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:thumbTint="#FF9F0A" android:trackTint="#3A3A3C"/>
                  </LinearLayout>

                  <TextView android:id="@+id/tvStatus"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="" android:textColor="#8E8E93" android:textSize="14sp"
                      android:layout_marginTop="16dp"/>

                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="設定未來時間後才可開啟" android:textColor="#48484A"
                      android:textSize="13sp" android:layout_marginTop="8dp"/>

              </LinearLayout>
          </ScrollView>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">倒數計時</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Countdown" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#1C1C1E</item>
                  <item name="android:statusBarColor">#1C1C1E</item>
                  <item name="android:numberPickerStyle">@style/NpStyle</item>
              </style>
              <style name="NpStyle" parent="android:Widget.NumberPicker">
                  <item name="android:textColorPrimary">#FFFFFF</item>
              </style>
          </resources>
          EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1C1C1E"/>
          </shape>
          EOF

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          for name in ic_launcher ic_launcher_round; do
            cat > app/src/main/res/mipmap-anydpi-v26/$name.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_background"/>
          </adaptive-icon>
          EOF
          done
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$density
            for name in ic_launcher ic_launcher_round; do
              echo '<?xml version="1.0" encoding="utf-8"?><bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@drawable/ic_launcher_background"/>' \
                > app/src/main/res/mipmap-$density/$name.xml
            done
          done

          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew" -o gradlew
          chmod +x gradlew
          echo "All files generated"

      - name: Restore keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/my.keystore

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Countdown-APK
          path: app/build/outputs/apk/release/app-release.apk
